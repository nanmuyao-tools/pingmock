name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o pingmock .
      - name: End-to-end test
        run: sudo REQUIRE_IPV6=1 test/e2e.sh
      - name: pingmock exec, rootless
        run: test/e2e-exec.sh
      - name: pingmock exec, as root
        run: sudo test/e2e-exec.sh

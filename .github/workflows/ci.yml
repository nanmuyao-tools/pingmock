name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Explicit images rather than ubuntu-latest, which moves from Ubuntu
    # 24.04 to 26.04 between 2026-10-19 and 2026-11-19: both stay covered,
    # whichever one users are on, and a result says which image it is for.
    # Drop 24.04 once GitHub retires it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # What pingmock depends on that differs between images, so that a
      # failure on one image can be compared with a success on the other.
      - name: Environment
        run: |
          grep PRETTY_NAME /etc/os-release
          echo "kernel: $(uname -r)"
          for key in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
            echo "$key: $(sysctl -n "$key" 2>/dev/null || echo absent)"
          done
          ls -l /dev/net/tun
          ip -V
          ping -V
          apparmor_parser --version | head -n 1
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Verify dependencies
        run: go mod verify
      - name: Shell scripts
        run: shellcheck -S warning test/*.sh scripts/*.sh examples/*/*.sh
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o pingmock .
      # traceroute and mtr, for the path checks of the end-to-end tests.
      - name: Install traceroute and mtr
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q traceroute mtr-tiny
          traceroute --version 2>&1 | head -n 1; mtr --version
      - name: End-to-end test
        run: sudo REQUIRE_IPV6=1 test/e2e.sh
      # Ubuntu 24.04 and later restrict unprivileged user namespaces with
      # AppArmor.
      # Allow them for pingmock only, with the profile users are told to
      # install, rather than lifting the restriction for everything.
      - name: Install the AppArmor profile
        run: |
          sed "s|profile pingmock /usr/local/bin/pingmock|profile pingmock $PWD/pingmock|" \
            contrib/apparmor/pingmock | sudo tee /etc/apparmor.d/pingmock
          sudo apparmor_parser -r /etc/apparmor.d/pingmock
      - name: pingmock exec, rootless
        run: test/e2e-exec.sh
      # The way users test Go code: the whole test binary runs inside
      # pingmock exec. Require a PASS, since outside exec the test skips.
      - name: go test -exec 'pingmock exec', rootless
        run: |
          go test -count=1 -v -exec "$PWD/pingmock exec -addr6= --" -run TestUnderPingmockExec ./client | tee test.out
          grep -q -- '--- PASS: TestUnderPingmockExec' test.out
      # The example users copy from, run against the code in this commit
      # rather than the release its go.mod names. A skipped test means it
      # did not run under pingmock, so that fails too.
      - name: Go example, rootless
        working-directory: examples/go-demo
        run: |
          go mod edit -replace github.com/nanmuyao/pingmock=../..
          go test -count=1 -v -exec "$GITHUB_WORKSPACE/pingmock exec -config pingmock.yaml --" ./... | tee test.out
          grep -q -- '--- PASS' test.out
          ! grep -E -- '--- (SKIP|FAIL)' test.out
      # The ping-library example, likewise: pro-bing's raw socket must work
      # rootless inside exec, and every test must run.
      - name: Ping-library example, rootless
        working-directory: examples/pinglib-demo
        run: |
          go mod edit -replace github.com/nanmuyao/pingmock=../..
          go test -count=1 -v -exec "$GITHUB_WORKSPACE/pingmock exec -config pingmock.yaml --" ./... | tee test.out
          grep -q -- '--- PASS' test.out
          ! grep -E -- '--- (SKIP|FAIL)' test.out
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Likewise for the Python example: its summary line must say that
      # every test passed, with none skipped.
      - name: Python example, rootless
        working-directory: examples/python-demo
        run: |
          pip install -r requirements.txt
          "$GITHUB_WORKSPACE/pingmock" exec -config pingmock.yaml -- python -m pytest -v -p no:cacheprovider | tee test.out
          tail -n 1 test.out | grep -E '^=+ [0-9]+ passed in [0-9.]+s =+$'
      # And for the shell example: a skip prints SKIP, not a summary.
      - name: Shell example, rootless
        working-directory: examples/shell-demo
        run: |
          "$GITHUB_WORKSPACE/pingmock" exec -config pingmock.yaml -- ./test.sh | tee test.out
          tail -n 1 test.out | grep -E '^[0-9]+ passed, 0 failed$'
      # Common ping tools and libraries, each with raw sockets and, for the
      # libraries, unprivileged ping sockets too.
      - name: Compatibility with ping tools and libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fping
          fping --version
          pip install -r test/compat/requirements.txt
          sudo env "PATH=$PATH" test/e2e-compat.sh
      - name: pingmock exec, as root
        run: sudo test/e2e-exec.sh

  docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Image and Compose example
        run: test/e2e-docker.sh
      # The release publishes amd64 and arm64 images; build both here, so a
      # problem shows up before a release does.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the release platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  # Runs the steps of examples/github-actions/pingmock-tests.yml exactly as
  # written there, so that the workflow users copy is known to work. Like
  # that workflow, it installs the release named in its PINGMOCK_VERSION;
  # the tests are those of examples/go-demo, which uses the same release.
  # GOFLAGS=-v lists the tests, so that skipped ones fail this job.
  workflow-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: The GitHub Actions example's steps
        run: |
          # Absolute: the steps run in other directories.
          wf="$GITHUB_WORKSPACE/examples/github-actions/pingmock-tests.yml"
          run_step() {
            local script
            script=$(yq ".jobs.test.steps[] | select(.name == \"$1\") | .run" "$wf")
            if [ -z "$script" ] || [ "$script" = null ]; then
              echo "no step named '$1' in $wf"
              exit 1
            fi
            bash -e -c "$script"
          }
          PINGMOCK_VERSION=$(yq '.env.PINGMOCK_VERSION' "$wf")
          export PINGMOCK_VERSION
          (cd "$RUNNER_TEMP" && run_step "Install pingmock")
          run_step "Allow pingmock to create user namespaces"
          cd examples/go-demo
          GOFLAGS=-v run_step "Test" | tee test.out
          grep -q -- '--- PASS' test.out
          ! grep -E -- '--- (SKIP|FAIL)' test.out

  # The development container (.devcontainer/), built and used as a
  # contributor on a Mac would use it: the checks run inside it, as its
  # unprivileged user, so that the container stays usable.
  devcontainer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The container's user gets the runner's uid, so that it can write
      # to the checked-out repository, which is bind-mounted.
      - name: Build the development container
        run: docker build --build-arg UID="$(id -u)" -t pingmock-dev -f .devcontainer/Dockerfile .
      # Ubuntu's AppArmor restriction on unprivileged user namespaces
      # applies inside containers too, where the host's profile for
      # pingmock cannot help. Lift it for this job: a Mac has no such
      # restriction, and the test job covers it with the profile.
      - name: Allow user namespaces in containers
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The checks, inside the container
        run: |
          docker run --rm --cap-add NET_ADMIN --cap-add SYS_ADMIN --device /dev/net/tun \
            --security-opt apparmor=unconfined \
            -v "$PWD:/workspace" -w /workspace pingmock-dev \
            bash -c 'make lint && make test && make e2e && make e2e-exec && make e2e-compat'

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o pingmock .
      - name: End-to-end test
        run: sudo REQUIRE_IPV6=1 test/e2e.sh
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
      # Allow them for pingmock only, with the profile users are told to
      # install, rather than lifting the restriction for everything.
      - name: Install the AppArmor profile
        run: |
          sed "s|profile pingmock /usr/local/bin/pingmock|profile pingmock $PWD/pingmock|" \
            contrib/apparmor/pingmock | sudo tee /etc/apparmor.d/pingmock
          sudo apparmor_parser -r /etc/apparmor.d/pingmock
      - name: pingmock exec, rootless
        run: test/e2e-exec.sh
      # The way users test Go code: the whole test binary runs inside
      # pingmock exec. Require a PASS, since outside exec the test skips.
      - name: go test -exec 'pingmock exec', rootless
        run: |
          go test -count=1 -v -exec "$PWD/pingmock exec -addr6= --" -run TestUnderPingmockExec ./client | tee test.out
          grep -q -- '--- PASS: TestUnderPingmockExec' test.out
      - name: pingmock exec, as root
        run: sudo test/e2e-exec.sh

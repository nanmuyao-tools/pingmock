name: Release

# Push an annotated tag to publish a release, titled with the tag name.
# The tag message after its first line becomes the release notes.
#   git tag -a v0.3.0 --cleanup=whitespace -F notes.txt && git push origin v0.3.0
# Tags containing a hyphen (v0.3.0-rc.1) are published as prereleases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Pinned rather than ubuntu-latest: the release must be reliable, so it
    # does not follow the label's migration (Ubuntu 26 from 2026-10-19). CI
    # tests on both Ubuntu 24.04 and 26.04, so changes show up there first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to find the previous release
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -o pingmock .
          sudo REQUIRE_IPV6=1 test/e2e.sh
          # Allow user namespaces for pingmock under Ubuntu's AppArmor
          # restriction, as in CI and as users are told to.
          sed "s|profile pingmock /usr/local/bin/pingmock|profile pingmock $PWD/pingmock|" \
            contrib/apparmor/pingmock | sudo tee /etc/apparmor.d/pingmock >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/pingmock
          test/e2e-exec.sh
          sudo test/e2e-exec.sh
          rm pingmock

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/pingmock-linux-$arch .
          done
          (cd dist && sha256sum pingmock-linux-* > SHA256SUMS && cat SHA256SUMS)
          ./dist/pingmock-linux-amd64 -version

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # checkout may turn the pushed tag into a lightweight one; fetch the
          # annotated tag object so its message is available.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          ./scripts/release-notes.sh "$TAG" "$REPO" > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag $flags

  image:
    needs: release
    # Pinned rather than ubuntu-latest: the release must be reliable, so it
    # does not follow the label's migration (Ubuntu 26 from 2026-10-19). CI
    # tests on both Ubuntu 24.04 and 26.04, so changes show up there first.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/$REPO"
          tags="$image:$TAG"
          # Prereleases do not move latest.
          case "$TAG" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}

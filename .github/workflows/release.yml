name: Release

# Push an annotated tag to publish a release. The tag message becomes the
# release notes: its first line is the title, the rest is the body.
#   git tag -a v0.3.0 -F notes.txt && git push origin v0.3.0
# Tags containing a hyphen (v0.3.0-rc.1) are published as prereleases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, to find the previous release
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -o pingmock .
          sudo REQUIRE_IPV6=1 test/e2e.sh
          rm pingmock

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/pingmock-linux-$arch .
          done
          (cd dist && sha256sum pingmock-linux-* > SHA256SUMS && cat SHA256SUMS)
          ./dist/pingmock-linux-amd64 -version

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # checkout may turn the pushed tag into a lightweight one; fetch the
          # annotated tag object so its message is available.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          ./scripts/release-notes.sh "$TAG" "$REPO" > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag $flags
